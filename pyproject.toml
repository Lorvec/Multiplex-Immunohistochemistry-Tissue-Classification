[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mihic-repro"
version = "1.0.0"
description = "Reproducibility code for compact knowledge-distilled MIHIC classifiers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{name = "Dimitris Kalatzis", email = "kalatzis.dimitrios@ac.eap.gr"}]
dependencies = [
  "numpy==2.3.4",
  "pandas==2.3.3",
  "scikit-learn==1.8.0",
  "matplotlib==3.10.8",
  "seaborn==0.13.2",
  "openpyxl==3.1.5",
  "pillow==12.0.0",
]

[project.urls]
Repository = "https://github.com/Lorvec/Multiplex-Immunohistochemistry-Tissue-Classification"
Dataset = "https://doi.org/10.5281/zenodo.10065510"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
